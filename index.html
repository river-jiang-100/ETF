<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF 收益平準金追蹤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--card:#fff;
  --bdr:rgba(0,0,0,0.08);
  --tx:#1a1d2e;--tx2:#4b5068;--tx3:#9399b2;
  --ac:#2563eb;--ac2:#1d4ed8;
  --up:#16a34a;--dn:#dc2626;
  --warn:#d97706;--warnbg:#fffbeb;
  --red-high:#dc2626;--red-bg:#fef2f2;
  --yellow:#ca8a04;--yellow-bg:#fefce8;
  --green:#16a34a;--green-bg:#f0fdf4;
  --mono:'JetBrains Mono',monospace;
  --sans:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh}

/* Header */
.hdr{background:var(--ac);padding:16px 24px 14px;color:#fff}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hdr h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.hdr-sub{font-size:12px;opacity:.75}
.update-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;font-family:var(--sans);cursor:pointer;transition:background .15s}
.update-btn:hover{background:rgba(255,255,255,0.35)}

/* Summary bar */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bdr)}
.sum-card{text-align:center;padding:10px 8px;border-radius:10px;background:var(--bg)}
.sum-label{font-size:11px;color:var(--tx3);margin-bottom:4px}
.sum-val{font-size:22px;font-weight:700;font-family:var(--mono)}

/* Main grid */
.main{padding:16px 24px;display:flex;flex-direction:column;gap:12px}

/* ETF Card */
.etf-card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--bdr);transition:box-shadow .15s}
.etf-card:hover{box-shadow:0 4px 16px rgba(37,99,235,0.10)}

.card-head{display:flex;align-items:stretch;gap:0}
.card-color{width:6px;flex-shrink:0;border-radius:0}
.card-main{flex:1;padding:14px 16px;display:flex;align-items:center;gap:0;flex-wrap:wrap}

.etf-id{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--ac);min-width:80px}
.etf-info{flex:1;min-width:160px}
.etf-name{font-size:14px;font-weight:500;color:var(--tx);line-height:1.3}
.etf-issuer{font-size:11px;color:var(--tx3);margin-top:2px}

.metrics{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-left:auto}

.metric{text-align:right;min-width:70px}
.metric-label{font-size:10px;color:var(--tx3);letter-spacing:.3px;margin-bottom:2px}
.metric-val{font-family:var(--mono);font-size:16px;font-weight:700}
.metric-val.price{color:var(--tx)}
.metric-val.up{color:var(--up)}
.metric-val.dn{color:var(--dn)}

/* 平準金主顯示 */
.eq-section{padding:12px 16px 14px 22px;border-top:1px solid var(--bdr);display:flex;align-items:center;gap:16px}
.eq-label{font-size:11px;color:var(--tx3);letter-spacing:.3px;white-space:nowrap}
.eq-bar-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
.eq-bar{height:10px;border-radius:6px;background:#e5e7eb;overflow:hidden;position:relative}
.eq-fill{height:100%;border-radius:6px;transition:width .6s ease}
.fill-low{background:linear-gradient(90deg,#16a34a,#4ade80)}
.fill-mid{background:linear-gradient(90deg,#d97706,#fbbf24)}
.fill-high{background:linear-gradient(90deg,#dc2626,#f87171)}
.eq-row-info{display:flex;align-items:baseline;gap:8px}
.eq-amt{font-family:var(--mono);font-size:24px;font-weight:700}
.eq-pct-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;font-family:var(--mono)}
.eq-date{font-size:11px;color:var(--tx3)}
.eq-nav-pct{font-size:12px;color:var(--tx3)}

/* 連結區 */
.card-links{padding:8px 16px 10px 22px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bdr)}
.link-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ac);text-decoration:none;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:4px 10px;transition:all .15s}
.link-btn:hover{background:#dbeafe;color:var(--ac2)}
.link-btn svg{width:10px;height:10px}

/* 手動更新區 */
.manual-section{padding:8px 16px 10px 22px;border-top:1px dashed var(--bdr);display:flex;align-items:center;gap:8px;background:#fafafa}
.manual-label{font-size:11px;color:var(--tx3)}
.manual-input{width:80px;border:1px solid var(--bdr);border-radius:6px;padding:4px 8px;font-size:13px;font-family:var(--mono);color:var(--tx);outline:none;background:var(--card)}
.manual-input:focus{border-color:var(--ac)}
.manual-btn{background:var(--ac);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:var(--sans)}
.manual-btn:hover{background:var(--ac2)}
.fav-btn{background:none;border:none;font-size:18px;cursor:pointer;padding:0 4px;line-height:1;color:#d1d5db;transition:color .15s}
.fav-btn.on{color:#f59e0b}
.fav-btn:hover{color:#f59e0b}

/* 顏色分級說明 */
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--tx3);padding:10px 24px;background:var(--card);border-bottom:1px solid var(--bdr)}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.tab-row{display:flex;gap:0;padding:0 24px;background:var(--card);border-bottom:1px solid var(--bdr)}
.tab-btn{padding:10px 16px;background:none;border:none;color:var(--tx3);font-size:13px;font-family:var(--sans);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab-btn:hover{color:var(--tx)}
.tab-btn.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:500}

.footer{text-align:center;padding:16px 24px;color:var(--tx3);font-size:11px;line-height:1.8}
.footer a{color:var(--ac);text-decoration:none}

@media(max-width:640px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .main,.summary,.hdr,.legend,.tab-row{padding-left:14px;padding-right:14px}
  .metrics{gap:12px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <h1>💰 ETF 收益平準金追蹤</h1>
    <button class="update-btn" onclick="window.location.reload()">↻ 重新載入</button>
  </div>
  <div class="hdr-sub" id="hdr-sub">資料截至 <span id="last-update">載入中…</span> ｜ 點各 ETF 下方連結前往投信官網查看最新數值</div>
</div>

<div class="summary">
  <div class="sum-card">
    <div class="sum-label">追蹤 ETF 數</div>
    <div class="sum-val" id="s-total" style="color:var(--ac)">7</div>
  </div>
  <div class="sum-card">
    <div class="sum-label">最高平準金</div>
    <div class="sum-val" id="s-max" style="color:var(--dn)">—</div>
  </div>
  <div class="sum-card">
    <div class="sum-label">平均平準金</div>
    <div class="sum-val" id="s-avg" style="color:var(--warn)">—</div>
  </div>
  <div class="sum-card">
    <div class="sum-label">我的最愛</div>
    <div class="sum-val" id="s-fav" style="color:var(--up)">0</div>
  </div>
</div>

<div class="legend">
  <span style="font-weight:500;color:var(--tx2)">平準金分級：</span>
  <span class="leg-item"><span class="leg-dot" style="background:var(--green)"></span>低（&lt;0.5元）</span>
  <span class="leg-item"><span class="leg-dot" style="background:var(--yellow)"></span>中（0.5~2元）</span>
  <span class="leg-item"><span class="leg-dot" style="background:var(--dn)"></span>高（&gt;2元）</span>
</div>

<div class="tab-row">
  <button class="tab-btn on" onclick="setTab('all',this)">全部</button>
  <button class="tab-btn" onclick="setTab('fav',this)">★ 最愛</button>
  <button class="tab-btn" onclick="setTab('high',this)">高平準金</button>
  <button class="tab-btn" onclick="setTab('sort',this)">由高到低</button>
</div>

<div class="main" id="main-list"></div>

<footer class="footer">
  ETF 收益平準金追蹤 ·
  資料來源：<a href="https://www.yuantaetfs.com" target="_blank">元大投信</a> ·
  <a href="https://websys.fsit.com.tw/FubonETF" target="_blank">富邦投信</a> ·
  <a href="https://www.uobam.com.tw" target="_blank">大華銀投信</a> ·
  <a href="https://www.capitalfund.com.tw" target="_blank">群益投信</a> ·
  <a href="https://www.syfunds.com.tw" target="_blank">永豐投信</a> ·
  <a href="https://www.cathaysite.com.tw" target="_blank">國泰投信</a><br>
  收益平準金數值可由下方「手動更新」輸入最新數值，資料存於瀏覽器本機。
</footer>

<script>
/* ═══════════════════════════════════════
   ETF 資料（已更新 0056 查詢網址）
   ═══════════════════════════════════════ */
const ETF_LIST = [
  {
    code: '0056',
    name: '元大高股息',
    issuer: '元大投信',
    color: '#2563eb',
    price: 48.91,
    chgPct: 0.35,
    eq: 4.29,
    eqDate: '2026/05/27',
    nav: 49.18,
    links: [
      { label: '收益平準金與配息查詢', url: 'https://www.yuantafunds.com/myfund/information/1084' }
    ]
  },
  {
    code: '00900',
    name: '富邦特選高股息30',
    issuer: '富邦投信',
    color: '#d97706',
    price: 18.41,
    chgPct: 0.27,
    eq: 0.65,
    eqDate: '2026/05/15',
    nav: 18.55,
    links: [
      { label: '富邦ETF投資網', url: 'https://websys.fsit.com.tw/FubonETF/Fund/Profile.aspx?stkId=00900' },
      { label: '配息專區', url: 'https://websys.fsit.com.tw/FubonETF/Dividend/Dividend.aspx' },
    ]
  },
  {
    code: '00918',
    name: '大華優利高填息30',
    issuer: '大華銀投信',
    color: '#7c3aed',
    price: 28.47,
    chgPct: 0.53,
    eq: 0.63,
    eqDate: '2026/05/26',
    nav: 27.91,
    links: [
      { label: '大華投信 ETF頁面', url: 'https://www.uobam.com.tw/fund/etf/88329556' },
      { label: '配息資訊', url: 'https://www.uobam.com.tw/dividend?type=etf' },
    ]
  },
  {
    code: '00919',
    name: '群益台灣精選高息',
    issuer: '群益投信',
    color: '#0891b2',
    price: 28.56,
    chgPct: 0.60,
    eq: 0.46,
    eqDate: '2026/05/20',
    nav: 28.72,
    links: [
      { label: '群益官網', url: 'https://www.capitalfund.com.tw/ETF/ETFContent?id=00919' },
      { label: '配息查詢', url: 'https://www.capitalfund.com.tw/ETF/Dividend' },
    ]
  },
  {
    code: '00907',
    name: '永豐優息存股',
    issuer: '永豐投信',
    color: '#db2777',
    price: 15.07,
    chgPct: 0.20,
    eq: 0.32,
    eqDate: '2026/05/22',
    nav: 15.18,
    links: [
      { label: '永豐投信官網', url: 'https://www.syfunds.com.tw/ETF/ETFContent?id=00907' },
      { label: '配息資訊', url: 'https://www.syfunds.com.tw/Fund/Dividend' },
    ]
  },
  {
    code: '00878',
    name: '國泰永續高股息',
    issuer: '國泰投信',
    color: '#16a34a',
    price: 30.03,
    chgPct: 0.47,
    eq: 0.17,
    eqDate: '2026/05/19',
    nav: 30.15,
    links: [
      { label: '國泰官網 ETF', url: 'https://www.cathaysite.com.tw/fund/api/etf' },
      { label: '配息資訊', url: 'https://www.cathaysite.com.tw/fund/dividend' },
    ]
  },
  {
    code: '00930',
    name: '永豐ESG低碳高息',
    issuer: '永豐投信',
    color: '#059669',
    price: 23.80,
    chgPct: 0.42,
    eq: 0.04,
    eqDate: '2026/05/22',
    nav: 23.91,
    links: [
      { label: '永豐投信官網', url: 'https://www.syfunds.com.tw/ETF/ETFContent?id=00930' },
      { label: '配息資訊', url: 'https://www.syfunds.com.tw/Fund/Dividend' },
    ]
  },
];

/* ════ State ════ */
let data = [], favs = new Set(), curTab = 'all';

function init() {
  try {
    const saved = JSON.parse(localStorage.getItem('etf-eq-data') || '{}');
    favs = new Set(JSON.parse(localStorage.getItem('etf-favs') || '[]'));
    data = ETF_LIST.map(e => {
      const s = saved[e.code] || {};
      return {
        ...e,
        eq: s.eq !== undefined ? s.eq : e.eq,
        eqDate: s.eqDate || e.eqDate,
        price: s.price !== undefined ? s.price : e.price,
        fav: favs.has(e.code)
      };
    });
  } catch(err) {
    data = ETF_LIST.map(e => ({ ...e, fav: false }));
  }

  const saved = localStorage.getItem('etf-last-update');
  document.getElementById('last-update').textContent = saved || new Date().toLocaleString('zh-TW');
  
  updateStats();
  render();
}

function save() {
  const obj = {};
  data.forEach(e => { obj[e.code] = { eq: e.eq, eqDate: e.eqDate, price: e.price }; });
  localStorage.setItem('etf-eq-data', JSON.stringify(obj));
  localStorage.setItem('etf-favs', JSON.stringify([...favs]));
  localStorage.setItem('etf-last-update', new Date().toLocaleString('zh-TW'));
}

function updateManual(code) {
  const inp = document.getElementById('inp-' + code);
  const val = parseFloat(inp.value);
  if (isNaN(val) || val < 0) { alert('請輸入有效數值'); return; }
  const e = data.find(x => x.code === code);
  if (!e) return;
  e.eq = val;
  e.eqDate = new Date().toLocaleDateString('zh-TW').replace(/\//g, '/');
  save();
  document.getElementById('last-update').textContent = new Date().toLocaleString('zh-TW');
  updateStats();
  renderCard(e);
}

function toggleFav(code) {
  const e = data.find(x => x.code === code);
  if (!e) return;
  e.fav = !e.fav;
  if (e.fav) favs.add(code); else favs.delete(code);
  save();
  updateStats();
  renderCard(e);
}

function setTab(t, el) {
  curTab = t;
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
  render();
}

function updateStats() {
  const eqVals = data.map(e => e.eq).filter(v => v != null);
  const maxEq = eqVals.length ? Math.max(...eqVals) : 0;
  const avgEq = eqVals.length ? eqVals.reduce((a, b) => a + b, 0) / eqVals.length : 0;
  document.getElementById('s-max').textContent = maxEq.toFixed(2);
  document.getElementById('s-avg').textContent = avgEq.toFixed(2);
  document.getElementById('s-fav').textContent = favs.size;
}

/* ════ Render ════ */
function render() {
  let list = [...data];
  if (curTab === 'fav') list = list.filter(e => e.fav);
  else if (curTab === 'high') list = list.filter(e => e.eq >= 2);
  else if (curTab === 'sort') list = [...list].sort((a, b) => (b.eq || 0) - (a.eq || 0));

  const container = document.getElementById('main-list');
  if (!list.length) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--tx3);font-size:13px;">沒有符合條件的 ETF</div>`;
    return;
  }
  container.innerHTML = list.map(e => buildCard(e)).join('');
}

function renderCard(e) {
  const el = document.getElementById('card-' + e.code);
  if (el) el.outerHTML = buildCard(e);
}

function buildCard(e) {
  const eq = e.eq;
  const nav = e.nav || null;
  const eqNavPct = (eq && nav) ? (eq / nav * 100).toFixed(2) : null;
  const barPct = Math.min((eq / 6) * 100, 100);
  const fillCls = eq >= 2 ? 'fill-high' : eq >= 0.5 ? 'fill-mid' : 'fill-low';
  const amtColor = eq >= 2 ? 'var(--dn)' : eq >= 0.5 ? 'var(--warn)' : 'var(--up)';
  const badgeBg = eq >= 2 ? '#fef2f2' : eq >= 0.5 ? '#fffbeb' : '#f0fdf4';
  const badgeColor = eq >= 2 ? 'var(--dn)' : eq >= 0.5 ? 'var(--warn)' : 'var(--up)';
  const sp = nav ? +(e.price - nav).toFixed(2) : null;
  const spPct = (sp && nav) ? +(sp / nav * 100).toFixed(2) : null;
  const chgCls = e.chgPct > 0 ? 'up' : e.chgPct < 0 ? 'dn' : '';

  const linksHtml = e.links.map(l =>
    `<a class="link-btn" href="${l.url}" target="_blank">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 1h4v4M11 1L5 7M4 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V8"/></svg>
      ${l.label}
    </a>`
  ).join('');

  return `
  <div class="etf-card" id="card-${e.code}">
    <div class="card-head">
      <div class="card-color" style="background:${e.color}"></div>
      <div class="card-main">
        <div class="etf-id">${e.code}</div>
        <div class="etf-info">
          <div class="etf-name">${e.name}</div>
          <div class="etf-issuer">${e.issuer}</div>
        </div>
        <div class="metrics">
          <div class="metric">
            <div class="metric-label">股價</div>
            <div class="metric-val price">${e.price.toFixed(2)}</div>
          </div>
          ${nav ? `<div class="metric">
            <div class="metric-label">淨值</div>
            <div class="metric-val price">${nav.toFixed(2)}</div>
          </div>` : ''}
          ${spPct != null ? `<div class="metric">
            <div class="metric-label">折溢價%</div>
            <div class="metric-val ${spPct > 0 ? 'up' : spPct < 0 ? 'dn' : ''}">${spPct > 0 ? '+' : ''}${spPct.toFixed(2)}%</div>
          </div>` : ''}
          <div class="metric">
            <div class="metric-label">漲跌</div>
            <div class="metric-val ${chgCls}">${e.chgPct > 0 ? '+' : ''}${e.chgPct.toFixed(2)}%</div>
          </div>
          <button class="fav-btn${e.fav ? ' on' : ''}" onclick="toggleFav('${e.code}')" title="${e.fav ? '移除最愛' : '加入最愛'}">${e.fav ? '★' : '☆'}</button>
        </div>
      </div>
    </div>

    <div class="eq-section">
      <div class="eq-label">收益平準金</div>
      <div class="eq-bar-wrap">
        <div class="eq-row-info">
          <span class="eq-amt" style="color:${amtColor}">${eq.toFixed(2)}</span>
          <span style="font-size:14px;color:var(--tx3);font-family:var(--mono)">元/單位</span>
          <span class="eq-pct-badge" style="background:${badgeBg};color:${badgeColor}">
            ${eqNavPct ? `佔淨值 ${eqNavPct}%` : ''}
          </span>
          <span class="eq-date">更新：${e.eqDate}</span>
        </div>
        <div class="eq-bar">
          <div class="eq-fill ${fillCls}" style="width:${barPct}%"></div>
        </div>
      </div>
    </div>

    <div class="card-links">
      ${linksHtml}
    </div>

    <div class="manual-section">
      <span class="manual-label">手動更新平準金：</span>
      <input class="manual-input" type="number" step="0.01" min="0" id="inp-${e.code}" placeholder="${eq.toFixed(2)}" value="">
      <button class="manual-btn" onclick="updateManual('${e.code}')">更新</button>
      <span style="font-size:10px;color:var(--tx3);margin-left:4px">（從投信官網查到後填入此欄）</span>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
