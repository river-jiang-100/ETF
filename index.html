<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF 收益平準金追蹤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f8;--card:#fff;--bdr:rgba(0,0,0,0.08);--bdr2:rgba(0,0,0,0.13);
  --tx:#1a1d2e;--tx2:#4b5068;--tx3:#9399b2;
  --ac:#2563eb;--ac2:#1d4ed8;
  --up:#16a34a;--dn:#dc2626;--warn:#d97706;
  --mono:'JetBrains Mono',monospace;--sans:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh}

/* Header */
.hdr{background:linear-gradient(135deg,#1e40af,#2563eb);padding:16px 24px 14px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.hdr-left h1{font-size:20px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.hdr-left p{font-size:11px;opacity:.7}
.btn-fetch-all{background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.5);color:#fff;border-radius:9px;padding:9px 18px;font-size:13px;font-family:var(--sans);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s}
.btn-fetch-all:hover{background:rgba(255,255,255,0.32)}
.btn-fetch-all:disabled{opacity:.5;cursor:not-allowed}
.spin{animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Progress */
.prog{height:3px;background:rgba(255,255,255,0.15);overflow:hidden;display:none}
.prog-fill{height:100%;background:#93c5fd;transition:width .4s}
.status-bar{padding:6px 24px;font-size:11px;color:var(--tx3);background:var(--card);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:7px}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#d1d5db;transition:background .3s}
.sdot.ok{background:var(--up);animation:pulse 2s infinite}
.sdot.loading{background:var(--ac);animation:pulse .8s infinite}
.sdot.err{background:var(--dn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bdr)}
.sc{background:var(--bg);border-radius:10px;padding:10px 14px;text-align:center}
.sc-l{font-size:11px;color:var(--tx3);margin-bottom:3px}
.sc-v{font-size:20px;font-weight:700;font-family:var(--mono)}

/* Tabs */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--bdr);padding:0 24px}
.tab{padding:9px 16px;background:none;border:none;color:var(--tx3);font-size:13px;font-family:var(--sans);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab:hover{color:var(--tx2)}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:500}

/* Cards */
.cards{padding:14px 24px;display:flex;flex-direction:column;gap:12px}

.etf-card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--bdr);transition:box-shadow .15s}
.etf-card:hover{box-shadow:0 4px 20px rgba(37,99,235,0.10)}

/* Card top row */
.card-top{display:flex;align-items:stretch}
.stripe{width:5px;flex-shrink:0}
.card-body{flex:1;padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.etf-code{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ac);min-width:74px}
.etf-meta{flex:1;min-width:130px}
.etf-name{font-size:14px;font-weight:500}
.etf-issuer{font-size:11px;color:var(--tx3);margin-top:2px}
.card-prices{display:flex;gap:16px;align-items:center;margin-left:auto;flex-wrap:wrap}
.price-blk{text-align:right}
.price-lbl{font-size:10px;color:var(--tx3);letter-spacing:.3px;margin-bottom:2px}
.price-val{font-family:var(--mono);font-size:15px;font-weight:700}
.fav-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#d1d5db;transition:color .15s;padding:0 3px;line-height:1}
.fav-btn.on{color:#f59e0b}
.fav-btn:hover{color:#f59e0b}

/* Equalization section */
.eq-section{padding:10px 16px 11px 21px;border-top:1px solid var(--bdr);display:flex;align-items:center;gap:14px}
.eq-left{min-width:130px}
.eq-lbl{font-size:10px;color:var(--tx3);letter-spacing:.4px;margin-bottom:3px}
.eq-num{font-family:var(--mono);font-size:28px;font-weight:700;line-height:1;cursor:pointer;border-bottom:2px dashed transparent;transition:border-color .15s;display:inline-block}
.eq-num:hover{border-bottom-color:currentColor}
.eq-unit{font-size:12px;color:var(--tx3)}
.eq-date{font-size:10px;color:var(--tx3);margin-top:3px}
.eq-right{flex:1;display:flex;flex-direction:column;gap:5px}
.eq-bar-bg{height:10px;border-radius:6px;background:#e5e7eb;overflow:hidden}
.eq-bar-fill{height:100%;border-radius:6px;transition:width .7s ease}
.fill-low{background:linear-gradient(90deg,#16a34a,#4ade80)}
.fill-mid{background:linear-gradient(90deg,#d97706,#fbbf24)}
.fill-high{background:linear-gradient(90deg,#dc2626,#f97316)}
.eq-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eq-badge{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600;font-family:var(--mono)}
.eq-nav-pct{font-size:11px;color:var(--tx3)}

/* Inline edit */
.eq-edit-row{display:none;align-items:center;gap:6px;margin-top:4px}
.eq-edit-row.show{display:flex}
.eq-inp{width:88px;border:2px solid var(--ac);border-radius:7px;padding:4px 9px;font-size:18px;font-family:var(--mono);font-weight:700;outline:none;color:var(--tx)}
.btn-ok{background:var(--ac);color:#fff;border:none;border-radius:6px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:var(--sans);font-weight:500}
.btn-ok:hover{background:var(--ac2)}
.btn-cancel{background:transparent;border:1px solid var(--bdr2);color:var(--tx3);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:var(--sans)}
.edit-hint{font-size:10px;color:var(--tx3)}

/* Fetch row */
.fetch-row{padding:8px 16px 9px 21px;border-top:1px solid var(--bdr);display:flex;align-items:center;gap:8px;background:#fafafa;flex-wrap:wrap}
.fetch-status{display:flex;align-items:center;gap:5px;font-size:11px;flex:1}
.cs-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cs-dot.idle{background:#d1d5db}
.cs-dot.loading{background:var(--ac);animation:pulse .8s infinite}
.cs-dot.ok{background:var(--up)}
.cs-dot.err{background:var(--dn)}
.cs-msg{color:var(--tx3)}
.btn-refetch{background:none;border:none;color:var(--ac);font-size:11px;cursor:pointer;font-family:var(--sans)}
.btn-refetch:hover{text-decoration:underline}

.btn-link-out{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ac);text-decoration:none;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:4px 10px;font-weight:500;transition:all .15s}
.btn-link-out:hover{background:#dbeafe;color:var(--ac2)}
.btn-link-out svg{width:11px;height:11px}

/* Legend */
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--tx3);padding:8px 24px;background:var(--card);border-bottom:1px solid var(--bdr)}
.leg{display:flex;align-items:center;gap:4px}
.leg-dot{width:9px;height:9px;border-radius:2px}

.footer{text-align:center;padding:16px 24px;color:var(--tx3);font-size:11px;line-height:1.9;border-top:1px solid var(--bdr);margin-top:4px;background:var(--card)}

@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hdr,.cards,.stats,.status-bar,.tabs,.legend{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>💰 ETF 收益平準金即時追蹤</h1>
    <p id="hdr-ts">點「⚡ 自動抓取」→ 元大自動解析，其他投信點「🌐 前往官網」查看後點數字更新</p>
  </div>
  <button class="btn-fetch-all" id="btn-all" onclick="fetchAll()">
    <span id="all-icon">⚡</span> 自動抓取全部
  </button>
</div>

<div class="prog" id="prog"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
<div class="status-bar"><span class="sdot" id="sdot"></span><span id="smsg">就緒，點「⚡ 自動抓取全部」開始</span></div>

<div class="stats">
  <div class="sc"><div class="sc-l">追蹤 ETF</div><div class="sc-v" id="s-n" style="color:var(--ac)">8</div></div>
  <div class="sc"><div class="sc-l">最高平準金</div><div class="sc-v" id="s-max" style="color:var(--dn)">—</div></div>
  <div class="sc"><div class="sc-l">平均平準金</div><div class="sc-v" id="s-avg" style="color:var(--warn)">—</div></div>
  <div class="sc"><div class="sc-l">最愛</div><div class="sc-v" id="s-fav" style="color:var(--up)">0</div></div>
</div>

<div class="legend">
  <span style="font-weight:500;color:var(--tx2)">平準金分級：</span>
  <span class="leg"><span class="leg-dot" style="background:#16a34a"></span>低（&lt;0.5元）</span>
  <span class="leg"><span class="leg-dot" style="background:#d97706"></span>中（0.5~2元）</span>
  <span class="leg"><span class="leg-dot" style="background:#dc2626"></span>高（&gt;2元）</span>
</div>

<div class="tabs">
  <button class="tab on" onclick="setTab('all',this)">全部</button>
  <button class="tab" onclick="setTab('fav',this)">★ 最愛</button>
  <button class="tab" onclick="setTab('sort',this)">由高到低</button>
</div>

<div class="cards" id="cards"></div>

<footer class="footer">
  ⚡ 元大(0056)：自動解析 HTML ｜ 其他投信：點擊「🌐 前往官網」開新分頁，看見最新數字後直接點卡片上的數字進行修改<br>
  資料存於瀏覽器本機 · 僅供參考
</footer>

<script>
/* ══ ETF 定義 ══ */
const ETF_LIST = [
  { code:'0056',  name:'元大高股息',      issuer:'元大投信', color:'#2563eb',
    price:50.15, nav:50.15, eq:4.29, eqDate:'2026/05/29',
    fetchUrl:'https://api.allorigins.win/get?url='+encodeURIComponent('https://www.yuantafunds.com/myfund/information/1084'),
    govUrl:'https://www.yuantafunds.com/myfund/information/1084',
    autoFetch: false
  },
  { code:'00900', name:'富邦特選高股息30', issuer:'富邦投信', color:'#d97706',
    price:18.73, nav:18.60, eq:0.65, eqDate:'2026/05/15',
    govUrl:'https://websys.fsit.com.tw/FubonETF/Fund/Nav.aspx?stkId=00900',
    autoFetch: false
  },
  { code:'00712', name:'復華富時不動產',   issuer:'復華投信', color:'#0f172a',
    price:9.85, nav:9.80, eq:0.15, eqDate:'2026/05/29',
    govUrl:'https://www.fhtrust.com.tw/ETF/etf_detail/ETF07#nav',
    autoFetch: false
  },
  { code:'00918', name:'大華優利高填息30', issuer:'大華銀投信', color:'#7c3aed',
    price:29.14, nav:29.14, eq:0.63, eqDate:'2026/05/26',
    govUrl:'https://www.uobam.com.tw/fund/etf/88329556',
    autoFetch: false
  },
  { code:'00919', name:'群益台灣精選高息', issuer:'群益投信', color:'#0891b2',
    price:28.58, nav:28.50, eq:0.46, eqDate:'2026/05/20',
    govUrl:'https://www.capitalfund.com.tw/etf/product/detail/195/trend',
    autoFetch: false
  },
  { code:'00907', name:'永豐優息存股',     issuer:'永豐投信', color:'#db2777',
    price:15.07, nav:15.10, eq:0.32, eqDate:'2026/05/22',
    govUrl:'https://sitc.sinopac.com/newweb/sitcFundUnitTrend/page.do?stock_id=88&tab_on=2',
    autoFetch: false
  },
  { code:'00878', name:'國泰永續高股息',   issuer:'國泰投信', color:'#16a34a',
    price:30.76, nav:30.86, eq:0.17, eqDate:'2026/05/29',
    govUrl:'https://www.cathaysite.com.tw/ETF/detail/ECN?tab=etf2',
    autoFetch: false
  },
  { code:'00930', name:'永豐ESG低碳高息',  issuer:'永豐投信', color:'#059669',
    price:23.80, nav:23.91, eq:0.04, eqDate:'2026/05/22',
    govUrl:'https://sitc.sinopac.com/newweb/sitcFundUnitTrend/page.do?stock_id=B5&tab_on=2',
    autoFetch: false
  },
];

/* ══ State ══ */
let data = [], favs = new Set(), curTab = 'all';

(function init(){
  try{
    const sv = JSON.parse(localStorage.getItem('etf-eq')||'{}');
    favs = new Set(JSON.parse(localStorage.getItem('etf-favs')||'[]'));
    data = ETF_LIST.map(e=>{
      const s=sv[e.code]||{};
      return{...e, eq:s.eq??e.eq, eqDate:s.eqDate||e.eqDate,
        nav:s.nav??e.nav, price:s.price??e.price,
        fav:favs.has(e.code), status:'idle', errMsg:''};
    });
  }catch(err){
    data = ETF_LIST.map(e=>({...e,fav:false,status:'idle',errMsg:''}));
  }
  document.getElementById('s-n').textContent = data.length;
  updateStats(); render();
})();

function saveData(){
  const obj={};
  data.forEach(e=>{obj[e.code]={eq:e.eq,eqDate:e.eqDate,nav:e.nav,price:e.price};});
  localStorage.setItem('etf-eq',JSON.stringify(obj));
  localStorage.setItem('etf-favs',JSON.stringify([...favs]));
}

/* ══ 自動抓取（元大） ══ */
async function autoFetch(code){
  const e=data.find(x=>x.code===code);
  if(!e||!e.autoFetch) return false;
  try{
    const r = await fetch(e.fetchUrl);
    const j = await r.json();
    const html = j.contents||'';
    const match = html.match(/(\d{4}\/\d{2}\/\d{2})[^|]*\|\s*[\d.]+\s*\|\s*([\d.]+)\s*\|\s*[\d.-]+\s*\|\s*([\d.]+)/);
    if(match){
      e.eqDate = match[1];
      e.eq = parseFloat(match[2]);
      e.nav = parseFloat(match[3]);
      return true;
    }
    const m2 = html.match(/\(B\)收益平準金[^0-9]*?([\d.]+)/);
    if(m2){ e.eq = parseFloat(m2[1]); return true; }
    return false;
  }catch(err){ return false; }
}

/* ══ 抓取全部 ══ */
async function fetchAll(){
  document.getElementById('btn-all').disabled=true;
  document.getElementById('all-icon').className='spin';
  document.getElementById('all-icon').textContent='↻';
  setProg(0); setStatus('自動抓取元大資料…','loading');

  const autoList = data.filter(e=>e.autoFetch);
  if(autoList.length > 0) {
    for(let i=0;i<autoList.length;i++){
      setProg(Math.round((i/data.length)*60));
      setStatus(`(${i+1}/${data.length}) 自動抓取 ${autoList[i].code}…`,'loading');
      const ok = await autoFetch(autoList[i].code);
      autoList[i].status = ok?'ok':'err';
      autoList[i].errMsg = ok?'':'自動解析失敗';
      renderCard(autoList[i]);
    }
    setStatus(`元大已更新 ✓ 其他投信請點擊「前往官網」查看並手動修改金額`,'ok');
  } else {
    setStatus(`請點選下方「🌐 前往官網」開新分頁查看，並於看見數字後點選左方金額直接修改。`,'ok');
  }

  setProg(100);
  setTimeout(hideProg, 1000);
  saveData(); updateStats();
  const ts=new Date().toLocaleString('zh-TW');
  document.getElementById('hdr-ts').textContent=`最後更新：${ts}`;
  document.getElementById('btn-all').disabled=false;
  document.getElementById('all-icon').className='';
  document.getElementById('all-icon').textContent='⚡';
}

/* ══ Edit ══ */
function startEdit(code){
  const e=data.find(x=>x.code===code);if(!e)return;
  document.getElementById('en-'+code).style.display='none';
  const row=document.getElementById('er-'+code);
  row.classList.add('show');
  const inp=document.getElementById('ei-'+code);
  inp.value=e.eq.toFixed(2); inp.focus(); inp.select();
}
function saveEdit(code){
  const inp=document.getElementById('ei-'+code);
  const v=parseFloat(inp.value);
  if(isNaN(v)||v<0){inp.focus();return;}
  const e=data.find(x=>x.code===code);if(!e)return;
  e.eq=v; e.eqDate=new Date().toLocaleDateString('zh-TW');
  e.status='ok';
  saveData(); updateStats(); renderCard(e);
}
function cancelEdit(code){
  renderCard(data.find(x=>x.code===code));
}
function toggleFav(code){
  const e=data.find(x=>x.code===code);if(!e)return;
  e.fav=!e.fav; if(e.fav)favs.add(code);else favs.delete(code);
  saveData(); updateStats(); renderCard(e);
}
function setTab(t,el){
  curTab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  el.classList.add('on'); render();
}
function setProg(w){document.getElementById('prog').style.display='block';document.getElementById('prog-fill').style.width=w+'%';}
function hideProg(){document.getElementById('prog').style.display='none';}
function setStatus(msg,type){
  document.getElementById('smsg').textContent=msg;
  const d=document.getElementById('sdot');
  const c={ok:'#16a34a',loading:'#3b82f6',err:'#dc2626'};
  d.style.background=c[type]||'#d1d5db';
  d.style.animation=(type==='loading'||type==='ok')?'pulse .8s infinite':'none';
}
function updateStats(){
  const v=data.map(e=>e.eq).filter(x=>x!=null&&!isNaN(x));
  document.getElementById('s-max').textContent=v.length?Math.max(...v).toFixed(2):'—';
  document.getElementById('s-avg').textContent=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'—';
  document.getElementById('s-fav').textContent=favs.size;
}

/* ══ Render ══ */
function render(){
  let list=[...data];
  if(curTab==='fav')list=list.filter(e=>e.fav);
  else if(curTab==='sort')list=[...list].sort((a,b)=>(b.eq||0)-(a.eq||0));
  document.getElementById('cards').innerHTML=list.map(buildCard).join('');
}
function renderCard(e){
  const el=document.getElementById('c-'+e.code);
  if(el)el.outerHTML=buildCard(e);
}

function buildCard(e){
  const eq=e.eq||0, nav=e.nav;
  const eqPct=nav?(eq/nav*100):null;
  const barW=Math.min((eq/6)*100,100);
  const fillCls=eq>=2?'fill-high':eq>=0.5?'fill-mid':'fill-low';
  const eqColor=eq>=2?'var(--dn)':eq>=0.5?'var(--warn)':'var(--up)';
  const badgeBg=eq>=2?'#fef2f2':eq>=0.5?'#fffbeb':'#f0fdf4';
  const sp=nav?+(e.price-nav).toFixed(2):null;
  const spPct=sp&&nav?+(sp/nav*100).toFixed(2):null;
  const spCl=spPct==null?'':spPct>0?'style="color:var(--up)"':'style="color:var(--dn)"';
  const stMap={idle:'idle',loading:'loading',ok:'ok',err:'err'};
  const stMsg={idle:'可手動更新數值',loading:'自動抓取中…',ok:'已更新 ✓',err:e.errMsg||'無法解析'};

  return `<div class="etf-card" id="c-${e.code}">
    <div class="card-top">
      <div class="stripe" style="background:${e.color}"></div>
      <div class="card-body">
        <div class="etf-code">${e.code}</div>
        <div class="etf-meta">
          <div class="etf-name">${e.name}</div>
          <div class="etf-issuer">${e.issuer}${e.autoFetch?' <span style="font-size:10px;background:#dbeafe;color:#1d4ed8;padding:1px 5px;border-radius:4px;margin-left:3px">自動</span>':' <span style="font-size:10px;background:#fef9c3;color:#854d0e;padding:1px 5px;border-radius:4px;margin-left:3px">手動</span>'}</div>
        </div>
        <div class="card-prices">
          ${nav?`<div class="price-blk"><div class="price-lbl">預設淨值</div><div class="price-val">${nav.toFixed(2)}</div></div>`:''}
          ${spPct!=null?`<div class="price-blk"><div class="price-lbl">折溢價</div><div class="price-val" ${spCl}>${spPct>=0?'+':''}${spPct.toFixed(2)}%</div></div>`:''}
          <button class="fav-btn${e.fav?' on':''}" onclick="toggleFav('${e.code}')">${e.fav?'★':'☆'}</button>
        </div>
      </div>
    </div>

    <div class="eq-section">
      <div class="eq-left">
        <div class="eq-lbl">收益平準金 (元/單位)</div>
        <div id="en-${e.code}">
          <span class="eq-num" style="color:${eqColor}" onclick="startEdit('${e.code}')" title="點擊修改">${eq.toFixed(2)}</span>
          <span class="eq-unit"> 元</span>
        </div>
        <div class="eq-edit-row" id="er-${e.code}">
          <input class="eq-inp" type="number" step="0.01" min="0" id="ei-${e.code}"
            onkeydown="if(event.key==='Enter')saveEdit('${e.code}');if(event.key==='Escape')cancelEdit('${e.code}')">
          <button class="btn-ok" onclick="saveEdit('${e.code}')">✓</button>
          <button class="btn-cancel" onclick="cancelEdit('${e.code}')">✕</button>
        </div>
        <div class="eq-date">資料日期：${e.eqDate||'—'}</div>
        <div class="edit-hint" style="margin-top:3px">👆 點數字可直接修改</div>
      </div>
      <div class="eq-right">
        <div class="eq-info">
          <span class="eq-badge" style="background:${badgeBg};color:${eqColor}">${eq>=2?'🔴 高':eq>=0.5?'🟡 中':'🟢 低'}平準金</span>
          ${eqPct?`<span class="eq-nav-pct">佔淨值 ${eqPct.toFixed(2)}%</span>`:''}
        </div>
        <div class="eq-bar-bg"><div class="eq-bar-fill ${fillCls}" style="width:${barW}%"></div></div>
      </div>
    </div>

    <div class="fetch-row">
      <a class="btn-link-out" href="${e.govUrl}" target="_blank">
        🌐 前往官網
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 1h4v4M11 1L5 7M4 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V8"/></svg>
      </a>
      <div class="fetch-status">
        <span class="cs-dot ${stMap[e.status||'idle']}"></span>
        <span class="cs-msg">${stMsg[e.status||'idle']}</span>
      </div>
      ${e.autoFetch ? `<button class="btn-refetch" onclick="fetchOne('${e.code}')">↻ 重新抓取</button>` : ''}
    </div>
  </div>`;
}

async function fetchOne(code){
  const e=data.find(x=>x.code===code);if(!e)return;
  e.status='loading'; renderCard(e);
  const ok=await autoFetch(code);
  e.status=ok?'ok':'err';
  e.errMsg=ok?'':'自動解析失敗';
  saveData(); updateStats(); renderCard(e);
}
</script>
</body>
</html>
